<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    
    <section class="container">
        <h1>Gerador de senhas</h1>

        <div class="senha-geradas">
            Selecione as opções
        </div>

        <form>
            <p><label>Quantidade de Caracteres: <input type="number" value="20" class="qtdCar" min="1" max="50" ></label></p>
            <p><label>Letras maiúsculas: <input type="checkbox" class="chk-maiuscula" checked></label></p>
            <p><label>Letras minúsculas: <input type="checkbox" class="chk-minuscula" checked></label></p>
            <p><label>adicionar número: <input type="checkbox" class="chk-num" checked></label></p>
            <p><label>adicionar símbolo: <input type="checkbox" class="chk-simb" checked></label></p>
            <button type="button" class="btn-gera-senha">Gera senha</button>
        </form>
    
    </section>

   

    <script src="./assets/js/bundle.js"></script>
</body>
</html>
